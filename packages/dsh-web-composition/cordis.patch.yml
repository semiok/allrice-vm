- insert:
    - id: allrice-web-composition
      name: '@allrice/dsh-web-composition'
    - id: allrice-settings-models-host
      name: '@allrice/dsh-web-composition/host/settings-models'
    - id: allrice-settings-account-host
      name: '@allrice/dsh-web-composition/host/settings-account'
    - id: allrice-plugin-manager-host
      name: '@allrice/dsh-web-composition/host/plugin-manager'
    - id: employee-directory-picker-host
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: employee-directory-picker-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
# The sealed employee profile and the VM must select the same native pair.
- id: directory-picker
  disabled: true
# Its Host entry is a no-op. The AllRice column is the cold-profile child owner;
# native settings-general continues to own the actual settings shell.
- id: ui-sidebar
  disabled: true
# Employee settings retain native General and all execution/Host services.
# The inserted Host-only entries reuse native Config defaults and behavior;
# native client-modules skips package subpaths. Retain the probe's Typert face.
- id: typert-loader
  config:
    packages:
      - '@deepseek-ai/dsh-client-ui-plugin-manager'
- id: ui-settings-models
  disabled: true
# These six disabled settings UI entries have native no-op Host halves.
# The employee profile selects Standard on the Host. The native Agent and
# permission services stay mounted; only the two selector plugins are absent.
- id: ui-agent-preset
  disabled: true
- id: ui-permission
  disabled: true
- id: agent-preset-registry
  config:
    default: standard
    selectedDefault: standard
- id: ui-settings-agent-loop
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-shell
  disabled: true
- id: ui-settings-subagent
  disabled: true
- id: ui-settings-web-search
  disabled: true
- id: ui-settings-account
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-trajectory
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: locale
  config:
    preference: zh
# The installed employee profile publishes a single immutable release graph.
- id: client-hmr
  disabled: true
